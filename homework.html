<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>自己紹介</title>
  <style>
    .c06{
  background-image: linear-gradient(to top, #a675a5 3px, transparent 3px);
  background-position: left bottom;
  background-repeat: no-repeat;
  background-size: 0% 100%;
  &.active{
    animation-name: kf_c06a, kf_c06b;
    animation-duration: 1s, 0s;
    animation-delay: 0s, 0.5s;
    animation-fill-mode: forwards;
  }
}
@keyframes kf_c06a {
  50%{
    background-size: 100% 100%;
  }
  100%{
    background-size: 0% 100%;
  }
}
@keyframes kf_c06b {
  100%{
    background-position: right bottom;
  }
}

body {
  font-family: serif;
}
  </style>
</head>
<body>
  <h1 span class="c06 active">自己紹介</span h1>
    <h1></h1><br>
  <h2> 名前：AMARUS2355 </h2>
   <h2>趣味：ゲーム</h2>

     <h2>経過時間：<span id="seconds">0</span>秒</h2>

  <script>
    const startTime = Date.now();
    const target = document.getElementById('seconds');

    setInterval(() => {
      const elapsedSeconds = Math.floor((Date.now() - startTime) / 1000);
      target.textContent = elapsedSeconds;
    }, 100);
  </script>
</body>
</html>
